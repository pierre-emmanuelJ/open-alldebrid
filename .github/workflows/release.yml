name: Release

# Publishes one SDK. Manual only: nothing is published until someone runs it.
#
# Before the first run:
# - npm: add a trusted publisher for the package (this repository, workflow
#   release.yml, environment npm) at npmjs.com.
# - PyPI: add a trusted publisher (this repository, workflow release.yml,
#   environment pypi) at pypi.org.
# - Create the "npm" and "pypi" environments in the repository settings,
#   ideally with a required reviewer.
#
# - crates.io and NuGet: add the CARGO_REGISTRY_TOKEN and NUGET_API_KEY
#   secrets to the "crates" and "nuget" environments.
#
# The others need no workflow:
# - Go: push a tag named sdks/go/vX.Y.Z.
# - Swift: push a tag named X.Y.Z (the root Package.swift is the package).
# - PHP: submit the repository once on packagist.org (the root composer.json
#   is the package); Packagist then follows the tags.
# - Kotlin: Maven Central needs a Sonatype account and a GPG key; publish
#   with ./gradlew publish once they are set up.

on:
  workflow_dispatch:
    inputs:
      sdk:
        description: SDK to publish
        required: true
        type: choice
        options: [typescript, python, rust, csharp]

permissions:
  contents: read

jobs:
  typescript:
    if: inputs.sdk == 'typescript'
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: sdks/typescript
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm run check
      - run: npm publish --provenance --access public

  python:
    if: inputs.sdk == 'python'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Test
        working-directory: sdks/python
        run: |
          python -m pip install --upgrade "pip>=25.1"
          python -m pip install -e . --group dev
          pytest
      - name: Build
        working-directory: sdks/python
        run: |
          python -m pip install build==1.3.0
          python -m build
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: sdks/python/dist

  rust:
    if: inputs.sdk == 'rust'
    runs-on: ubuntu-latest
    environment: crates
    defaults:
      run:
        working-directory: sdks/rust
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: "1.98"
      - run: cargo test
      - run: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  csharp:
    if: inputs.sdk == 'csharp'
    runs-on: ubuntu-latest
    environment: nuget
    defaults:
      run:
        working-directory: sdks/csharp
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - run: dotnet test --solution OpenAllDebrid.slnx
      - run: dotnet pack src/OpenAllDebrid/OpenAllDebrid.csproj -c Release -o out
      - run: dotnet nuget push "out/*.nupkg" --source https://api.nuget.org/v3/index.json --api-key "$NUGET_API_KEY"
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
