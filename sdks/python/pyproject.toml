[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[project]
name = "open-alldebrid"
version = "1.0.0"
description = "Typed client for the AllDebrid API, built from the open-alldebrid OpenAPI spec"
readme = "README.md"
license = "MIT"
authors = [{ name = "Pierre-Emmanuel Jacquier" }]
requires-python = ">=3.11"
dependencies = ["httpx>=0.27,<1"]
keywords = ["alldebrid", "debrid", "magnet", "torrent", "openapi", "sdk"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/pierre-emmanuelJ/open-alldebrid/tree/master/sdks/python"
Repository = "https://github.com/pierre-emmanuelJ/open-alldebrid"
Issues = "https://github.com/pierre-emmanuelJ/open-alldebrid/issues"

[dependency-groups]
dev = [
  "pytest==9.1.1",
  "pytest-asyncio==1.4.0",
  "mypy==2.3.1",
  "ruff==0.16.9",
  "pyyaml==6.0.3",
  "datamodel-code-generator==0.82.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/open_alldebrid"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["demo: calls the real API with the public demo keys"]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["src/open_alldebrid/models.py"]

[tool.ruff.format]
# Generated by scripts/unasync.py from the formatted _async_client.py.
exclude = ["src/open_alldebrid/_sync_client.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
strict = true
files = ["src", "tests"]
