getLinkInfos:
  go: |
    infos, err := client.LinkInfos(ctx, "", "https://1fichier.com/?abcdefghij")
    for _, info := range infos {
        if info.Error.Code != "" {
            continue // this link is down or unsupported
        }
        fmt.Println(info.Filename, info.Size)
    }
  typescript: |
    const infos = await client.linkInfos(["https://1fichier.com/?abcdefghij"]);
    for (const info of infos) {
      if (info.error) continue; // this link is down or unsupported
      console.log(info.filename, info.size);
    }
  python: |
    for info in client.link_infos(["https://1fichier.com/?abcdefghij"]):
        if "error" in info:
            continue  # this link is down or unsupported
        print(info["filename"], info["size"])
  kotlin: |
    val infos = client.linkInfos(listOf("https://1fichier.com/?abcdefghij"))
    for (info in infos) {
        if (info.error != null) continue // this link is down or unsupported
        println("${info.filename} ${info.size}")
    }
  php: |
    $infos = $client->linkInfos(['https://1fichier.com/?abcdefghij']);
    foreach ($infos as $info) {
        if ($info->error !== null) {
            continue; // this link is down or unsupported
        }
        echo $info->filename, ' ', $info->size, "\n";
    }
  rust: |
    let infos = client.link_infos(&["https://1fichier.com/?abcdefghij"], None).await?;
    for info in infos {
        if info.error.is_some() {
            continue; // this link is down or unsupported
        }
        println!("{:?} {:?}", info.filename, info.size);
    }
  csharp: |
    var infos = await client.LinkInfosAsync(new[] { "https://1fichier.com/?abcdefghij" });
    foreach (var info in infos)
    {
        if (info.Error is not null) continue; // this link is down or unsupported
        Console.WriteLine($"{info.Filename} {info.Size}");
    }

