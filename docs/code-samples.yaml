unlockLink:
  go: |
    u, err := client.Unlock(ctx, "https://1fichier.com/?abcdefghij", "")
    if errors.Is(err, alldebrid.CodeLinkDown) {
        return
    }
    link := u.Link
    if u.Delayed != "" {
        link, err = client.WaitDelayedLink(ctx, u.Delayed.String(), 0)
    }
  typescript: |
    const u = await client.unlock("https://1fichier.com/?abcdefghij");
    const link = u.delayed ? await client.waitDelayedLink(u.delayed) : u.link;
  python: |
    u = client.unlock("https://1fichier.com/?abcdefghij")
    link = client.wait_delayed_link(u["delayed"]) if u.get("delayed") else u["link"]
  kotlin: |
    val u = client.unlock("https://1fichier.com/?abcdefghij")
    val link = u.delayed?.let { client.waitDelayedLink(it.value) } ?: u.link
  php: |
    $u = $client->unlock('https://1fichier.com/?abcdefghij');
    $link = $u->delayed !== null ? $client->waitDelayedLink($u->delayed) : $u->link;
  rust: |
    let u = client.unlock("https://1fichier.com/?abcdefghij", None).await?;
    let link = match u.delayed {
        Some(id) => client.wait_delayed_link(id.as_str(), Duration::from_secs(5)).await?,
        None => u.link.unwrap_or_default(),
    };
  csharp: |
    var u = await client.UnlockAsync("https://1fichier.com/?abcdefghij");
    var link = u.Delayed is { } id ? await client.WaitDelayedLinkAsync(id.Value) : u.Link;

