# SDK code samples shown on the docs page, per operationId.
# contract/samples_test.go checks that every operation has one sample per
# language and that each sample calls a method of that SDK.
#
# Every sample assumes a client:
#   Go:         client := alldebrid.New(apiKey)
#   TypeScript: const client = new AllDebrid({ apiKey });
#   Python:     client = AllDebrid(api_key)
#   Kotlin:     val client = AllDebrid(apiKey)
#   PHP:        $client = new AllDebrid($apiKey);
#   Rust:       let client = AllDebrid::new(api_key);
#   C#:         var client = new AllDebrid(apiKey);

ping:
  go: |
    err := client.Ping(ctx)
  typescript: |
    await client.ping();
  python: |
    client.ping()
  kotlin: |
    client.ping()
  php: |
    $client->ping();
  rust: |
    client.ping().await?;
  csharp: |
    await client.PingAsync();

getPin:
  go: |
    pin, err := client.GetPin(ctx)
    fmt.Println("Open", pin.UserURL)
    apiKey, err := client.WaitForPin(ctx, pin, 0)
  typescript: |
    const pin = await client.getPin();
    console.log("Open", pin.user_url);
    const apiKey = await client.waitForPin(pin);
  python: |
    pin = client.get_pin()
    print("Open", pin["user_url"])
    api_key = client.wait_for_pin(pin)
  kotlin: |
    val pin = client.getPin()
    println("Open ${pin.userUrl}")
    val apiKey = client.waitForPin(pin)
  php: |
    $pin = $client->getPin();
    echo "Open {$pin->userUrl}\n";
    $apiKey = $client->waitForPin($pin);
  rust: |
    let pin = client.get_pin().await?;
    println!("Open {}", pin.user_url);
    let api_key = client.wait_for_pin(&pin, Duration::from_secs(5)).await?;
  csharp: |
    var pin = await client.GetPinAsync();
    Console.WriteLine($"Open {pin.UserUrl}");
    var apiKey = await client.WaitForPinAsync(pin);

checkPin:
  go: |
    state, err := client.CheckPin(ctx, pin.Pin, pin.Check)
    if state.Activated {
        apiKey := state.Apikey
    }
  typescript: |
    const state = await client.checkPin(pin.pin, pin.check);
    if (state.activated) console.log(state.apikey);
  python: |
    state = client.check_pin(pin["pin"], pin["check"])
    if state["activated"]:
        api_key = state["apikey"]
  kotlin: |
    val state = client.checkPin(pin.pin, pin.check)
    if (state.activated) println(state.apikey)
  php: |
    $state = $client->checkPin($pin->pin, $pin->check);
    if ($state->activated) {
        $apiKey = $state->apikey;
    }
  rust: |
    let state = client.check_pin(&pin.pin, &pin.check).await?;
    if state.activated {
        println!("{:?}", state.apikey);
    }
  csharp: |
    var state = await client.CheckPinAsync(pin.Pin, pin.Check);
    if (state.Activated) Console.WriteLine(state.Apikey);

