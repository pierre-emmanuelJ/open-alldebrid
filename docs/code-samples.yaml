getVerificationStatus:
  go: |
    var apiErr *alldebrid.Error
    if errors.As(err, &apiErr) && apiErr.Code == "AUTH_BLOCKED" {
        v, err := client.VerificationStatus(ctx, apiErr.Token)
        fmt.Println(v.Verif) // waiting, allowed or denied
    }
  typescript: |
    if (err instanceof AllDebridError && err.code === "AUTH_BLOCKED") {
      const v = await client.verificationStatus(err.token!);
      console.log(v.verif); // waiting, allowed or denied
    }
  python: |
    except AllDebridError as err:
        if err.code == "AUTH_BLOCKED":
            v = client.verification_status(err.token)
            print(v["verif"])  # waiting, allowed or denied
  kotlin: |
    catch (e: AllDebridException) {
        if (e.code == ErrorCodes.AUTH_BLOCKED) {
            val v = client.verificationStatus(e.token!!)
            println(v.verif) // waiting, allowed or denied
        }
    }
  php: |
    } catch (AllDebridException $e) {
        if ($e->errorCode === ErrorCode::AUTH_BLOCKED) {
            $v = $client->verificationStatus($e->token);
            echo $v->verif; // waiting, allowed or denied
        }
    }
  rust: |
    Err(Error::Api { code, token: Some(token), .. }) if code == error_codes::AUTH_BLOCKED => {
        let v = client.verification_status(&token).await?;
        println!("{}", v.verif); // waiting, allowed or denied
    }
  csharp: |
    catch (AllDebridException e) when (e.Code == ErrorCodes.AuthBlocked)
    {
        var v = await client.VerificationStatusAsync(e.Token!);
        Console.WriteLine(v.Verif); // waiting, allowed or denied
    }

