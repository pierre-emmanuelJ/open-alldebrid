getMagnetStatus:
  go: |
    all, err := client.Magnets(ctx)
    one, err := client.Magnet(ctx, id) // with its Files

    live := client.LiveMagnets() // only transfers changes
    magnets, err := live.Poll(ctx)
  typescript: |
    const all = await client.magnets();
    const one = await client.magnet(id); // with its files

    const live = client.liveMagnets(); // only transfers changes
    const magnets = await live.poll();
  python: |
    all_magnets = client.magnets()
    one = client.magnet(magnet_id)  # with its files

    live = client.live_magnets()  # only transfers changes
    magnets = live.poll()
  kotlin: |
    val all = client.magnets()
    val one = client.magnet(id) // with its files

    val live = client.liveMagnets() // only transfers changes
    val magnets = live.poll()
  php: |
    $all = $client->magnets();
    $one = $client->magnet($id); // with its files

    $live = $client->liveMagnets(); // only transfers changes
    $magnets = $live->poll();
  rust: |
    let all = client.magnets().await?;
    let one = client.magnet(id).await?; // with its files

    let mut live = client.live_magnets(); // only transfers changes
    let magnets = live.poll().await?;
  csharp: |
    var all = await client.MagnetsAsync();
    var one = await client.MagnetAsync(id); // with its files

    var live = client.LiveMagnets(); // only transfers changes
    var magnets = await live.PollAsync();

